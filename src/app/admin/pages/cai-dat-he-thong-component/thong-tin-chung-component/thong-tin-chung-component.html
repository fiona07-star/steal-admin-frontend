<div class="tab-content-wrapper">
  
  <!-- KHU VỰC 1: THÔNG TIN CHUNG -->
  <div class="content-block">
    <h3 class="block-title">Thông tin chung</h3>
    
    <div class="form-grid-top">
      <!-- Tên website -->
      <div class="form-group">
        <label>Tên website<span class="required">*</span></label>
        <div class="input-with-counter">
          <input type="text" [(ngModel)]="cauHinhData.tenWebsite" maxlength="100" />
          <span class="char-counter">{{ cauHinhData.tenWebsite.length }}/100</span>
        </div>
      </div>

      <!-- Website (URL) -->
      <div class="form-group">
        <label>Website (URL)<span class="required">*</span></label>
        <div class="input-with-icon">
          <i class="bi bi-share-fill input-icon"></i>
          <input type="text" [(ngModel)]="cauHinhData.urlWebsite" />
        </div>
      </div>

      <!-- Email hỗ trợ -->
      <div class="form-group">
        <label>Email hỗ trợ<span class="required">*</span></label>
        <div class="input-with-icon">
          <i class="bi bi-envelope-fill input-icon"></i>
          <input type="email" [(ngModel)]="cauHinhData.emailHoTro" />
        </div>
      </div>

      <!-- Hotline -->
      <div class="form-group">
        <label>Hotline<span class="required">*</span></label>
        <div class="input-with-icon">
          <i class="bi bi-telephone-fill input-icon"></i>
          <input type="text" [(ngModel)]="cauHinhData.hotline" />
        </div>
      </div>
    </div>

    <!-- Mô tả website -->
    <div class="form-group full-width">
      <label>Mô tả website<span class="required">*</span></label>
      <textarea rows="2" [(ngModel)]="cauHinhData.moTaWebsite"></textarea>
    </div>
  </div>

  <!-- KHU VỰC 2: LOGO VÀ HÌNH ẢNH -->
  <div class="content-block">
    <h3 class="block-title">Logo và hình ảnh</h3>
    <div class="block-divider"></div>

    <div class="logo-upload-container">
      
      <!-- Logo Store -->
      <div class="logo-upload-box">
        <span class="logo-label">Logo cho Store (header)</span>
        <div class="logo-preview-row">
          <div class="logo-img-wrapper">
            <img [src]="cauHinhData.logoStore" alt="Logo Store" (error)="$event.target.src='assets/images/logo.png'" />
          </div>
          <div class="logo-actions">
            <label class="btn-change-logo">
              <i class="bi bi-pencil-square"></i> Thay đổi
              <input type="file" (change)="onFileSelected($event, 'store')" accept="image/*" hidden />
            </label>
            <span class="logo-note">PNG, JPG (tối đa 50MB)</span>
          </div>
        </div>
      </div>

      <div class="logo-vertical-divider"></div>

      <!-- Logo Admin -->
      <div class="logo-upload-box">
        <span class="logo-label">Logo cho Admin (Dashboard)</span>
        <div class="logo-preview-row">
          <div class="logo-img-wrapper">
            <img [src]="cauHinhData.logoAdmin" alt="Logo Admin" (error)="$event.target.src='assets/images/logo.png'" />
          </div>
          <div class="logo-actions">
            <label class="btn-change-logo">
              <i class="bi bi-pencil-square"></i> Thay đổi
              <input type="file" (change)="onFileSelected($event, 'admin')" accept="image/*" hidden />
            </label>
            <span class="logo-note">PNG, JPG (tối đa 50MB)</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- KHU VỰC 3: CẬP NHẬT & NÚT THAO TÁC (ĐẨY NÚT XUỐNG DƯỚI 1 XÍU) -->
  <div class="content-block footer-block">
    <div class="block-divider"></div>

    <div class="footer-actions-row">
      <div class="update-time-text">
        Cập nhật lần cuối: {{ cauHinhData.capNhatLanCuoi }}
      </div>

      <div class="btn-group">
        <button type="button" class="btn-reset" (click)="khoiPhucMacDinh()">
          <i class="bi bi-arrow-repeat"></i> Khôi phục mặc định
        </button>
        
        <button type="button" class="btn-save" (click)="luuThayDoi()">
          <i class="bi bi-folder-fill"></i> Lưu thay đổi
        </button>
      </div>
    </div>
  </div>

</div>
